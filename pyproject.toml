[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadline-runtime"
version = "0.1.0"
description = "Deadline-aware execution runtime for coding agent tools."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "openai",
    "pytest",
]

[tool.setuptools]
packages = ["agent", "demo", "runtime", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
